# Godis Redis Server Configuration with Web Todo Feature
# This configuration enables the Web Todo feature alongside the Redis server

# Redis Server Configuration
bind 0.0.0.0
port 6399
databases 16

# Persistence Configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
aof-use-rdb-preamble yes

# RDB Configuration
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000

# Performance Configuration
maxclients 1000
slowlog-log-slower-than 10000
slowlog-max-len 128

# Directory Configuration
dir ./data

# Security Configuration (optional)
# requirepass your_password_here

# Logging Configuration
# Use environment variables or command line for logger configuration

# Web Todo Feature Configuration
# These are handled by environment variables or command line arguments:
# ENABLE_WEB_TODO=true
# WEB_TODO_PORT=8080
# WEB_TODO_REDIS_ADDR=127.0.0.1:6399
# WEB_TODO_STATIC_DIR=./webtodo/static